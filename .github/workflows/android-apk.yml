name: Build installable Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure Gradle for preinstalled Java
        run: |
          sed -i 's/gradle-8\.14\.3-bin\.zip/gradle-8.13-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' android/settings.gradle
      - name: Inspect Expo Android module metadata
        run: |
          echo '--- Autolinking module resolution ---'
          npx expo-modules-autolinking resolve --platform android
          echo '--- Module config files ---'
          find node_modules -name expo-module.config.json -print
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapper-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
